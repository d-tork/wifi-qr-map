# Where the map is. Change `center`, run `make fetch`, then `make demo`.
# Use another file with `make fetch demo CONFIG=path/to/other.yaml`.
# The scale is fixed (a house plot is one QR module), so the sheet shows about a mile
# from `center` to each edge.

name: Alexandria             # names the OSM cache file in data/, and the default title
center: [38.8165, -77.0480]  # lat, lon of the middle of the map

title: "A  PLAN  of  the  TOWN  of  ALEXANDRIA"  # default: "A  PLAN  of  <NAME>"
subtitle: "with ROSEMONT and the late TOWN of POTOMAC, call’d DEL RAY, in VIRGINIA"

ward:                        # the hidden QR code
  center: [38.8238, -77.0580]  # default: the map centre (Del Ray, the former Town of Potomac)
  angle: auto                # follow the nearest major street, or degrees counter-clockwise

legend:
  center: [38.8268, -77.0335]  # in the river; default: the lower-left corner of the map

# OSM features (exact `name` tag) drawn as symbols: temple | church | market | lighthouse
landmarks:
  George Washington Masonic National Memorial: temple
  Christ Church: church
  Market Square: market
  Jones Point Lighthouse: lighthouse

# Hachured hills: [lat, lon, radius in metres]
hills:
  - [38.8076, -77.0661, 260]

# Place names. Leave this out to label towns, neighbourhoods and large waters from OSM.
# style: caps | italic | sc; size is relative; angle in degrees; tracking in em.
labels:
  - {at: [38.8070, -77.0460], text: ALEXANDRIA, size: 2.3, style: caps, angle: 9, tracking: 0.35}
  - {at: [38.8140, -77.0612], text: ROSEMONT, size: 1.5, style: caps, tracking: 0.3}
  # Subtitle first: labels displaced by the QR ward stack upward in order.
  - {at: [38.8273, -77.0580], text: "now call'd Del Ray", size: 1.05}
  - {at: [38.8287, -77.0580], text: TOWN of POTOMAC, size: 1.45, style: caps, tracking: 0.12}
  - {at: [38.8120, -77.0332], text: "POTOMAC  RIVER", size: 2.4, style: caps, angle: 82, tracking: 0.25}
  - {at: [38.8046, -77.0628], text: "Shooter's Hill", size: 0.95}
  - {at: [38.8262, -77.0470], text: Potomac Yard, size: 0.85, angle: 88}

# With no OSM cache, draw the hand-plotted Alexandria schematic (qrmap/seed.py) instead of
# stopping. Only meaningful for this location.
offline_fallback: alexandria
